# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.29.1"
  python_check_max: "3.15"
  cov_fail_under: "80"
  unlink_tests: test_docs_cleanup.py test_prepare_release.py
  pytest_k: |-
    not (
      (multiple_values and main)
      or completion
      or invalid_score
      or path_convert_failures
      or (types_file and file_error)
      or binary_stderr
      or (help and (tutorial_004 or tutorial_003))
      or tuple_wrong_arity
    )

package:
  name: typer
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/typer/typer-${{ version }}.tar.gz
  sha256: ab6eb3880bf67ce96147734717f9ec333c06f66e361f3ea947d0be43da39f242

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - typer = typer.cli:main
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --check-build-dependencies
    - ${{ PYTHON }} -c "import os; [os.unlink(f'tests/{p}') for p in '''${{ unlink_tests }}'''.split()]"

requirements:
  host:
    - pdm-backend
    - pip
    - python ${{ python_min }}.*
  run:
    - annotated-doc >=0.0.2
    - colorama
    - pydantic >=2.5.3
    - python >=${{ python_min }}
    - rich >=13.8.0
    - shellingham >=1.3.0

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/typer/**
      site_packages:
        - typer/**
        - typer-${{ version }}.dist-info/**
  - python:
      imports: typer
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/**
        - docs_src/**
    requirements:
      run:
        - coverage >=7.13
        - pytest >=9.0.0
        - python ${{ python_min }}.*
    script:
      - typer --version
      - typer --help
      - coverage run --source=typer --branch -m pytest -vv --color=yes --tb=long -k "${{ pytest_k | replace("\n", " ") }}"
      - coverage report --show-missing --skip-covered --fail-under=${{ cov_fail_under }}

about:
  license: MIT AND BSD-3-Clause
  license_file:
    - LICENSE
    - typer/_click/LICENSE.txt
  summary: Typer, build great CLIs. Easy to code. Based on Python type hints.
  homepage: https://pypi.org/project/typer
  documentation: https://typer.tiangolo.com
  repository: https://github.com/fastapi/typer

extra:
  recipe-maintainers:
    - thewchan
    - dfornika
    - bollwyvl
    - fcollonval
